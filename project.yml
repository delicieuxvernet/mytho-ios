name: Mytho

options:
  bundleIdPrefix: fr.mytho
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ONLY_ACTIVE_ARCH: YES
      # Requis par `@testable import Mytho` dans la suite de tests.
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

# Aucune dépendance externe : le jeu tourne hors ligne, les builds restent rapides
# et il n'y a aucun SDK tiers à faire signer en CI.

targets:
  Mytho:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Mytho
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.mytho.app
        PRODUCT_NAME: Mytho
        INFOPLIST_FILE: Mytho/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D87R3L7B75
        CURRENT_PROJECT_VERSION: 1
        # La 1.0.0 est publiée : Apple clôt son « train » et refuse tout
        # nouveau build à ce numéro. Chaque release App Store impose donc de
        # bumper ici avant le push suivant.
        # 1.1.0 est approuvee et en vente depuis le 20 aout 2026 : son train est
        # ferme, TestFlight refuse tout nouveau build qui la porte encore.
        MARKETING_VERSION: "1.2.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
      configs:
        Release:
          # Signature manuelle cantonnée à la cible app + config Release, comme
          # sur le repo Kiwio : passer ces réglages globalement casserait
          # l'archive si des paquets SPM étaient ajoutés plus tard.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore fr.mytho.app"

  MythoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MythoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.mytho.app.tests
        PRODUCT_NAME: MythoTests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mytho.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Mytho"
    dependencies:
      - target: Mytho

  # Captures d'écran uniquement — jamais dans la gate de déploiement : les tests
  # d'interface sont lents et sujets aux faux négatifs.
  MythoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MythoUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.mytho.app.uitests
        PRODUCT_NAME: MythoUITests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Mytho
    dependencies:
      - target: Mytho

schemes:
  Mytho:
    build:
      targets:
        Mytho: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MythoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Scheme séparé : le scheme Mytho reste sur les seuls tests unitaires, rapides
  # et déterministes, puisque c'est lui qui garde le déploiement.
  MythoScreenshots:
    build:
      targets:
        Mytho: all
        MythoUITests: [test]
    test:
      config: Debug
      targets:
        - MythoUITests
